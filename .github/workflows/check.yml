name: Check posts and build

# 記事の検査(scripts/check-posts.mjs)とビルドを、PR と main への push で走らせる。
# 壊れた記事が 1 本でもあれば、全件のファイル名と行番号を出して止まる。デプロイはしない。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:posts
      - run: npm run build
