<style>
:root{
  --paper:#fef8f0; --ink:#2c2825; --claw:#e74c3c; --claw-soft:#fbeae7; --blue:#5b8def;
  --yellow:#fef08a; --fade:#807872; --line:#ebe3d6; --cell:#fffdf9; --cell-empty:#faf3e9;
  --bar:rgba(12,10,20,.88); --bar-text:rgba(255,255,255,.55);
  --font-heading:"Shippori Mincho B1","Noto Serif JP","Hiragino Mincho ProN",serif;
  --font-jp:"Noto Sans JP","Hiragino Sans",sans-serif;
  --font-display:"Cinzel","Noto Sans JP",serif;
  --font-italic:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1814; --ink:#f1ebe2; --claw:#ef6656; --claw-soft:rgba(239,102,86,.16); --blue:#7ea4f5;
    --yellow:#6b5d12; --fade:#a69c92; --line:#3a332c; --cell:#221e19; --cell-empty:#1e1a16;
    --bar:rgba(8,7,12,.92); --bar-text:rgba(255,255,255,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#1b1814; --ink:#f1ebe2; --claw:#ef6656; --claw-soft:rgba(239,102,86,.16); --blue:#7ea4f5;
  --yellow:#6b5d12; --fade:#a69c92; --line:#3a332c; --cell:#221e19; --cell-empty:#1e1a16;
  --bar:rgba(8,7,12,.92); --bar-text:rgba(255,255,255,.6);
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-jp);line-height:1.85;font-size:15px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── 疑似サイトヘッダー(実サイトの Header と同じ黒帯) ── */
.site-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
.site-bar .in{max-width:64rem;margin:0 auto;padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;color:rgba(255,255,255,.9);font-family:var(--font-heading);font-weight:700;font-size:.9rem;letter-spacing:.02em}
.brand i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c0392b 70%);border:1px solid rgba(255,255,255,.25);display:inline-block}
.site-nav{display:flex;align-items:center;gap:0;font-size:.72rem;letter-spacing:.18em;color:var(--bar-text)}
.site-nav span{margin:0 1rem;color:rgba(255,255,255,.2)}
.site-nav a.on{color:var(--claw)}
@media (max-width:520px){.brand b{display:none}.site-nav{letter-spacing:.1em}.site-nav span{margin:0 .6rem}}

.wrap{max-width:52rem;margin:0 auto;padding-block:3.5rem 5rem;padding-inline:1rem}
.eyebrow{font-size:.76rem;letter-spacing:.3em;color:var(--claw);text-align:center;margin:0 0 .6rem}
h2.page{font-family:var(--font-heading);font-size:clamp(2rem,6vw,2.9rem);font-weight:800;text-align:center;margin:0 0 .5rem;letter-spacing:-.01em;text-wrap:balance}
h2.page mark{background:var(--yellow);color:inherit;padding:0 .35em}
.total{text-align:center;color:var(--fade);font-size:.86rem;margin:0 0 2.6rem}

/* ── 月タブ ── */
.months{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);margin:0 -1rem 2rem;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.months .row{display:flex;align-items:stretch;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.months .row::-webkit-scrollbar{display:none}
.year{flex:none;align-self:center;font-family:var(--font-display);font-size:.8rem;letter-spacing:.12em;color:var(--fade);padding:0 .6rem 0 .1rem;border-right:1px solid var(--line);margin-right:.2rem}
.mtab{flex:none;display:flex;flex-direction:column;align-items:center;min-width:3.9rem;padding:.35rem .7rem .3rem;border-radius:.6rem;border:1px solid var(--line);background:var(--cell);line-height:1.25;transition:background .2s,border-color .2s}
.mtab b{font-family:var(--font-heading);font-size:1.05rem;font-weight:800}
.mtab small{font-size:.66rem;color:var(--fade);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.mtab:hover{border-color:var(--claw)}
.mtab[aria-selected="true"]{background:var(--claw);border-color:var(--claw);color:#fff}
.mtab[aria-selected="true"] small{color:rgba(255,255,255,.8)}
.mtab.future{opacity:.45;border-style:dashed;pointer-events:none}

/* ── 月ヘッダー ── */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1.4rem}
.mtitle{display:flex;align-items:center;gap:.6rem}
.mtitle h3{font-family:var(--font-heading);font-size:clamp(1.5rem,4.5vw,2rem);font-weight:800;margin:0;line-height:1.2}
.mtitle h3 .y{font-family:var(--font-display);font-weight:600;font-size:.6em;color:var(--fade);letter-spacing:.1em;margin-right:.35em;vertical-align:.12em}
.mmeta{color:var(--fade);font-size:.82rem;font-variant-numeric:tabular-nums;margin:.15rem 0 0}
.mmeta b{color:var(--ink);font-weight:700}
.navbtn{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:var(--cell);display:grid;place-items:center;color:var(--fade);transition:.2s}
.navbtn:hover:not(:disabled){border-color:var(--claw);color:var(--claw)}
.navbtn:disabled{opacity:.3;cursor:default}
.navbtn svg{width:14px;height:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--cell)}
.seg button{padding:.3rem .9rem;border-radius:999px;font-size:.78rem;letter-spacing:.08em;color:var(--fade)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ── カレンダー ── */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{text-align:center;font-size:.68rem;letter-spacing:.15em;color:var(--fade);padding:.2rem 0 .4rem}
.cal .wd.sun{color:var(--claw)}
.day{position:relative;min-height:5.6rem;border-radius:.55rem;background:var(--cell);border:1px solid var(--line);padding:.4rem .5rem .5rem;display:flex;flex-direction:column;gap:.25rem;transition:border-color .2s,transform .2s}
.day.empty{background:var(--cell-empty);border-color:transparent}
.day.pad{background:transparent;border-color:transparent;min-height:0}
.day.future{border-style:dashed;background:transparent}
.day .n{font-size:.72rem;color:var(--fade);font-variant-numeric:tabular-nums;line-height:1}
.day.sun .n{color:var(--claw)}
.day.today .n{color:#fff;background:var(--claw);border-radius:999px;padding:.15rem .4rem;align-self:flex-start}
.day a{display:flex;flex-direction:column;gap:.2rem;flex:1;min-width:0}
.day a:hover .t{color:var(--claw)}
.day.has:hover{border-color:var(--claw);transform:translateY(-1px)}
.ep{display:inline-block;align-self:flex-start;font-size:.62rem;font-weight:700;line-height:1;padding:.22rem .45rem;border-radius:999px;background:var(--ink);color:var(--paper)}
.day .t{font-size:.76rem;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);transition:color .2s}
@media (max-width:640px){
  .cal{gap:3px}
  .day{min-height:4rem;padding:.3rem .3rem .35rem;border-radius:.4rem}
  .day .t{display:none}
  .day.has::after{content:"";position:absolute;left:50%;bottom:.45rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--claw);transform:translateX(-50%)}
  .ep{font-size:.58rem;padding:.2rem .35rem}
}

/* ── リスト ── */
.list{list-style:none;margin:0;padding:0 0 0 1.3rem;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:.2rem}
.list li{position:relative}
.list li::before{content:"";position:absolute;left:calc(-1.3rem - 7px);top:1.05rem;width:12px;height:12px;border-radius:50%;background:var(--claw);border:2px solid var(--paper)}
.list a{display:grid;grid-template-columns:3rem auto 1fr;grid-template-rows:auto auto;column-gap:.7rem;align-items:baseline;padding:.6rem .7rem;border-radius:.6rem;transition:background .2s}
.list a:hover{background:var(--claw-soft)}
.list .d{font-family:var(--font-display);font-size:.8rem;color:var(--fade);font-variant-numeric:tabular-nums;grid-row:1/3;align-self:start;padding-top:.25rem}
.list .d small{font-family:var(--font-jp);font-size:.62rem;display:block;letter-spacing:.05em;line-height:1.2}
.list .t{font-weight:700;font-size:.98rem;line-height:1.5}
.list a:hover .t{color:var(--claw)}
.list .desc{grid-column:2/4;color:var(--fade);font-size:.8rem;line-height:1.6;margin-top:.1rem;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:520px){.list .desc{display:none}.list a{grid-template-columns:2.6rem auto 1fr}}

.foot{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);color:var(--fade);font-size:.78rem;line-height:1.7}
.foot em{font-family:var(--font-italic);font-style:italic;font-size:1.05em}
.jump{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.jump a,.jump button{flex:1;min-width:12rem;padding:.7rem 1rem;border:1px solid var(--line);border-radius:.7rem;background:var(--cell);font-size:.82rem;color:var(--fade);text-align:left;transition:.2s}
.jump a:hover,.jump button:hover:not(:disabled){border-color:var(--claw);color:var(--ink)}
.jump button:disabled{opacity:.35;cursor:default}
.jump .lbl{display:block;font-size:.64rem;letter-spacing:.2em;color:var(--claw);margin-bottom:.1rem}
.jump .next{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const byMonth = {};
for (const p of POSTS) { const ym = p.pubDate.slice(0,7); (byMonth[ym] ||= []).push(p); }

function renderTabs(){

    html += `<button class="mtab" role="tab" data-ym="${ym}" aria-selected="${ym===cur}"><b>${+ym.slice(5)}月</b><small>${byMonth[ym].length} 篇</small></button>`;
  }
  $("months").innerHTML = html;
  $("months").querySelectorAll(".mtab").forEach(b => b.onclick = () => go(b.dataset.ym));

  sel && sel.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
}

function renderCal(){

  for (let i=0;i<first.getDay();i++) html += `<div class="day pad"></div>`;

      (p ? `<a href="${BASE}${p.slug}/" title="${esc(p.title)}">${p.episode!=null?`<span class="ep">#${p.episode}</span>`:""}<span class="t">${esc(p.title)}</span></a>` : "") + `</div>`;
  }

    const d = new Date(p.pubDate+"T00:00:00");
    return `<li><a href="${BASE}${p.slug}/"><span class="d">${d.getDate()}<small>${WD[d.getDay()]}曜</small></span>` +
      `${p.episode!=null?`<span class="ep">#${p.episode}</span>`:"<span></span>"}<span class="t">${esc(p.title)}</span>` +
      `<span class="desc">${esc(p.description)}</span></a></li>`;
  }).join("") + `</ul>`;
}

function render(){
  renderTabs(); renderHead();
  view === "cal" ? renderCal() : renderList();
  try { localStorage.setItem("archive.month", cur); localStorage.setItem("archive.view", view); } catch (e) {}
  if (location.hash !== "#"+cur) history.replaceState(null, "", "#"+cur);
}
function go(ym){ if (byMonth[ym]) { cur = ym; render(); } }
$("prev").onclick = () => go(months[months.indexOf(cur)-1]);
$("next").onclick = () => go(months[months.indexOf(cur)+1]);
$("jprev").onclick = $("prev").onclick; $("jnext").onclick = $("next").onclick;
$("v-cal").onclick = () => { view = "cal"; render(); };
$("v-list").onclick = () => { view = "list"; render(); };
document.addEventListener("keydown", e => { if (e.key==="ArrowLeft") $("prev").click(); if (e.key==="ArrowRight") $("next").click(); });
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
$("total").textContent = `全 ${POSTS.length} 篇の物語 · ${months.length} か月`;
render();
</script>
